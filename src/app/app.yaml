# Databricks Apps runtime configuration.
#
# THE ENVIRONMENT BLOCK BELONGS HERE, not in the bundle. `resources.apps.*.config.env` exists in
# the bundle JSON schema and validates happily, but the deploy silently drops it: the created app
# has no `config` key at all, and every variable arrives unset. Cost of learning that: one
# deploy that started cleanly and then failed on `'DATABRICKS_WAREHOUSE_ID'`.
#
# The bundle still parameterizes the VALUES -- see below.
# --server.enableXsrfProtection=false is not cosmetic: without it the file uploader fails with
# "AxiosError: Request failed with status code 400". Streamlit posts uploads to its own
# /_stcore/upload_file endpoint with an XSRF token, and Databricks Apps serves the app behind its
# own ingress -- the token check does not survive that hop, so every upload is rejected.
#
# CORS is disabled alongside it because Streamlit refuses to run XSRF-off with CORS-on and will
# silently re-enable XSRF, putting the 400 straight back.
#
# THE SECURITY TRADE, stated rather than glossed: XSRF protection guards against another site
# making a request as a signed-in user. That matters for an app open to the internet. This one is
# not -- Databricks Apps authenticates every request before it reaches the container, and the
# service principal's own permissions bound what any request can do. The exposure is small and the
# alternative is an uploader that does not work.
command: [
  "streamlit", "run", "app.py",
  "--server.enableXsrfProtection=false",
  "--server.enableCORS=false",
  # Streamlit's websocket is permessage-deflate compressed by default, which some reverse proxies
  # mishandle -- the symptom is a connection that drops and re-establishes repeatedly, greying the
  # page out each time. Turning compression off trades a little bandwidth for a stable socket.
  "--server.enableWebsocketCompression=false",
]

env:
  # `valueFrom` names a resource attached to the app in resources/smart_claims.app.yml. The
  # platform substitutes the real id/path at runtime, so nothing sensitive is written down, and
  # the resource NAMES are identical across targets even when the things they point at are not.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse

  # Resolves to the Lakebase ENDPOINT path, which is what generate_database_credential() takes.
  # The platform also injects PGHOST, PGDATABASE, PGUSER, PGPORT and PGSSLMODE for a postgres
  # resource -- but NOT PGPASSWORD, because there is no static password. Auth is OAuth and the
  # token lasts 60 minutes (measured).
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres

  - name: CLAIMS_VOLUME
    valueFrom: claims-volume

  # HOW A STATIC FILE STILL GETS A PER-TARGET VALUE. This resource is a Unity Catalog TABLE whose
  # `securable_full_name` the bundle builds from ${resources.schemas.gold.name} -- so it resolves
  # to dev_keqingli1129_gold in dev and gold in prod. The app reads the answer rather than
  # assembling it from a catalog and a schema it would otherwise have to be told separately.
  #
  # Attaching it is also what GRANTS the service principal SELECT on that table. Attaching the
  # warehouse only grants CAN_USE on the warehouse; Unity Catalog permissions on the data are a
  # separate thing, and without this the query would fail on permissions even with the right name.
  - name: CLAIMS_TABLE
    valueFrom: gold-claims-table

  # The chat feature's key. Resolves to the secret VALUE, not the scope/key names -- the platform
  # reads it out of the Databricks secret store at container start. Which also means a rotated key
  # needs an app restart: the variable is set once, when the process starts.
  - name: OPENAI_API_KEY
    valueFrom: openai-key

  # Model id as CONFIG, not a constant in app.py, so changing it is an app.yaml edit rather than a
  # code change. `gpt-5.5` is the current undated alias -- it moves as OpenAI updates it, which is
  # what you want while learning and not what you want if answers must be reproducible. Pin a
  # dated snapshot (e.g. gpt-5.5-2026-04-23) for that.
  #
  # PLACEHOLDER pending the user's choice: the key can also reach gpt-5.6-luna / -sol / -terra and
  # the mini/nano/pro tiers, whose tradeoffs postdate what I can advise on.
  - name: OPENAI_MODEL
    value: gpt-5.5
