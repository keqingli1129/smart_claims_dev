# Plays the part of "someone pushes their files into your S3 bucket" -- the premise part 3
# opens with. The transcript reads an external volume somebody else had already filled; this
# fills two managed volumes instead.
#
# Only needed because there is no real bucket. With one, this job becomes irrelevant and the
# pipeline reads the bucket directly -- nothing else changes, because Auto Loader sees a path
# either way.

resources:
  jobs:
    object_storage_generator:
      name: object_storage_generator
      description: Writes synthetic images and CSV metadata into the landing volumes.

      tasks:
        - task_key: generate
          # No cluster spec -> serverless job compute.
          notebook_task:
            notebook_path: ../src/jobs/generate_object_storage_files.py
            base_parameters:
              mode: seed
              training_images_path: /Volumes/${var.catalog}/${resources.schemas.landing.name}/${resources.volumes.training_images.name}
              claims_path: /Volumes/${var.catalog}/${resources.schemas.landing.name}/${resources.volumes.claims.name}
              # Lets the metadata reference claim numbers that really exist in part 2's data.
              # Harmless if part 2 was never run -- the generator falls back to synthetic ids.
              source_schema: ${var.catalog}.${resources.schemas.source.name}
              random_seed: "7"
