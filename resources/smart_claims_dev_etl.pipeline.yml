# The main pipeline for smart_claims_dev

resources:
  pipelines:
    smart_claims_dev_etl:
      name: smart_claims_dev_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/smart_claims_dev_etl"

      libraries:
        - glob:
            include: ../src/smart_claims_dev_etl/transformations/**

      # Read by the transformation files via spark.conf.get(...). This is how a pipeline passes
      # deploy-time configuration into pipeline code.
      configuration:
        source_mode: ${var.source_mode}
        landing_volume_path: /Volumes/${var.catalog}/${resources.schemas.landing.name}/${resources.volumes.telematics_raw.name}
        kinesis.stream_name: ${var.kinesis_stream_name}
        kinesis.region: ${var.kinesis_region}
        kinesis.service_credential: ${var.kinesis_service_credential}
        kafka.bootstrap_servers: ${var.kafka_bootstrap_servers}
        kafka.topic: ${var.kafka_topic}
        kafka.starting_offsets: ${var.kafka_starting_offsets}
        kafka.secret_scope: ${var.kafka_secret_scope}
        eventhubs.namespace: ${var.eventhubs_namespace}
        eventhubs.name: ${var.eventhubs_name}
        eventhubs.starting_offsets: ${var.eventhubs_starting_offsets}
        eventhubs.secret_scope: ${var.eventhubs_secret_scope}
        eventhubs.secret_key: ${var.eventhubs_secret_key}

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
