# The main pipeline for smart_claims_dev

resources:
  pipelines:
    smart_claims_dev_etl:
      name: smart_claims_dev_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true

      # NO `continuous:` HERE -- and, in the dev target, no point putting one.
      #
      # A triggered pipeline (the default) processes whatever has arrived and stops. A continuous
      # one never finishes: the update stays RUNNING, records appear in the tables as they land,
      # and serverless compute is held until you stop it. That last clause is the whole cost
      # difference, which is why `mode: development` strips `continuous: true` out of a pipeline
      # the same way it pauses job schedules -- an idle laptop cannot leave a bill running.
      # Setting it here is silently ignored in dev and honoured in prod, which is worse than not
      # setting it at all.
      #
      # To run the continuous demo against the dev pipeline, flip the deployed pipeline itself:
      #
      #   id=$(databricks bundle summary -t dev -o json | jq -r .resources.pipelines.smart_claims_dev_etl.id)
      #   databricks pipelines get $id -o json | jq '.spec + {continuous: true}' > /tmp/spec.json
      #   databricks pipelines update $id --json @/tmp/spec.json     # starts immediately
      #   # ... run telematics_generator with a high num_batches and watch the counts climb ...
      #   databricks pipelines stop $id && databricks bundle deploy -t dev   # back to triggered
      #
      # The stop is not optional. Until it runs, the pipeline holds serverless compute.
      root_path: "../src/smart_claims_dev_etl"

      libraries:
        - glob:
            include: ../src/smart_claims_dev_etl/transformations/**

      # Read by the transformation files via spark.conf.get(...). This is how a pipeline passes
      # deploy-time configuration into pipeline code.
      configuration:
        source_mode: ${var.source_mode}
        landing_volume_path: /Volumes/${var.catalog}/${resources.schemas.landing.name}/${resources.volumes.telematics_raw.name}
        kinesis.stream_name: ${var.kinesis_stream_name}
        kinesis.region: ${var.kinesis_region}
        kinesis.service_credential: ${var.kinesis_service_credential}
        kafka.bootstrap_servers: ${var.kafka_bootstrap_servers}
        kafka.topic: ${var.kafka_topic}
        kafka.starting_offsets: ${var.kafka_starting_offsets}
        kafka.secret_scope: ${var.kafka_secret_scope}
        eventhubs.namespace: ${var.eventhubs_namespace}
        eventhubs.name: ${var.eventhubs_name}
        eventhubs.starting_offsets: ${var.eventhubs_starting_offsets}
        eventhubs.secret_scope: ${var.eventhubs_secret_scope}
        eventhubs.secret_key: ${var.eventhubs_secret_key}

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
