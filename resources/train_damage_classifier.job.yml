# Part 5: fine-tune, track, register, score.
#
# A JOB rather than a pipeline, for the same reason archive_claim_images.job.yml is one: this
# is imperative work with side effects outside the lakehouse -- it downloads a checkpoint from
# Hugging Face, writes an MLflow experiment, and registers a model version. None of that is a
# dataset definition, and a declarative pipeline has nowhere to put it.
#
# NOT A TASK IN smart_claims_pipeline. That job runs hourly; this one retrains a model. Hanging
# a retrain off an hourly ingestion schedule would register twenty-four model versions a day,
# each from the same unchanged 56 images, and quietly move @prod onto the last one to finish.
# Retraining is a decision somebody makes, so it stays a manually-triggered job -- the same
# reasoning that keeps the three data generators out of that job.

resources:
  jobs:
    train_damage_classifier:
      name: train_damage_classifier
      description: Fine-tunes ResNet on the labelled training images, registers it to UC, scores in batch.

      # No schedule. See the note above.
      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - keqingli1129@gmail.com

      tasks:
        - task_key: train
          notebook_task:
            notebook_path: ../src/jobs/train_damage_classifier.py
            base_parameters:
              # Resolved through the schema RESOURCES, not the variables, so development mode's
              # dev_<user>_ renaming is picked up and these point at the tables the pipelines
              # actually wrote.
              catalog: ${var.catalog}
              bronze_schema: ${resources.schemas.bronze.name}
              silver_schema: ${resources.schemas.silver.name}
              gold_schema: ${resources.schemas.gold.name}
              model_name: claims_damage_level
              # Blank means the notebook builds /Users/<whoever runs it>/smart_claims/... , which
              # is what keeps a dev run out of a colleague's experiment. Set it explicitly for a
              # shared prod experiment.
              experiment_path: ""
              base_model: microsoft/resnet-50
              image_size: "224"
              epochs: "5"
              batch_size: "8"
              learning_rate: "5e-5"
              test_fraction: "0.25"
              random_seed: "42"

          # THE ONE CLASSIC CLUSTER IN THIS BUNDLE. Everything else here is serverless, and the
          # transcript's reason for the exception is library availability: "we will use a machine
          # learning cluster as it has lots of those frameworks and libraries that we need
          # already pre-installed". The ML runtime brings torch, torchvision and scikit-learn;
          # the notebook adds only transformers and datasets on top.
          new_cluster:
            # Pinned to an LTS ML runtime rather than a rolling one, because the whole point of
            # choosing classic here is a known set of pre-installed libraries -- a runtime that
            # moves underneath the job would defeat it. `-cpu-` and not `-gpu-`: 56 images at
            # 224px do not fill a GPU, and the instance would cost several times more to sit
            # idle. Swap to 16.4.x-gpu-ml-scala2.13 with a g4dn.xlarge for a real dataset.
            spark_version: 16.4.x-cpu-ml-scala2.12
            node_type_id: m5d.xlarge

            # SINGLE NODE. The three settings below have to agree or the cluster fails to start,
            # and all three are required -- num_workers alone is not enough.
            #
            # It is the right shape as well as the cheap one: the fine-tune runs entirely on the
            # driver in torch, and the only distributed work is the resize UDF and the scoring
            # UDF over 56 rows. Workers would idle through the part that takes the time.
            num_workers: 0
            spark_conf:
              spark.master: "local[*, 4]"
              spark.databricks.cluster.profile: singleNode
            custom_tags:
              ResourceClass: SingleNode

            # Required for the notebook to read Unity Catalog tables and write a UC model under
            # the identity of whoever runs the job.
            data_security_mode: SINGLE_USER

          # One retry, matching clean_and_aggregate in transformations.job.yml: a classic cluster
          # can fail to acquire an instance, and that is worth a second attempt before a person
          # gets involved. It is also why the notebook is safe to re-run -- every table it writes
          # is `mode("overwrite")` and registering a second model version is additive.
          max_retries: 1
          min_retry_interval_millis: 60000

          # Generous but finite. A cold classic cluster is ~5 minutes before any code runs, and
          # five epochs of ResNet-50 on CPU is another ten or so. Without a timeout a hung
          # Hugging Face download would hold the cluster open indefinitely.
          timeout_seconds: 5400
