# Part 5: fine-tune, track, register, score.
#
# A JOB rather than a pipeline, for the same reason archive_claim_images.job.yml is one: this
# is imperative work with side effects outside the lakehouse -- it downloads a checkpoint from
# Hugging Face, writes an MLflow experiment, and registers a model version. None of that is a
# dataset definition, and a declarative pipeline has nowhere to put it.
#
# NOT A TASK IN smart_claims_pipeline. That job runs hourly; this one retrains a model. Hanging
# a retrain off an hourly ingestion schedule would register twenty-four model versions a day,
# each from the same unchanged 56 images, and quietly move @prod onto the last one to finish.
# Retraining is a decision somebody makes, so it stays a manually-triggered job -- the same
# reasoning that keeps the three data generators out of that job.

resources:
  jobs:
    train_damage_classifier:
      name: train_damage_classifier
      description: Fine-tunes ResNet on the labelled training images, registers it to UC, scores in batch.

      # No schedule. See the note above.
      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - keqingli1129@gmail.com

      tasks:
        - task_key: train
          notebook_task:
            notebook_path: ../src/jobs/train_damage_classifier.py
            base_parameters:
              # Resolved through the schema RESOURCES, not the variables, so development mode's
              # dev_<user>_ renaming is picked up and these point at the tables the pipelines
              # actually wrote.
              catalog: ${var.catalog}
              bronze_schema: ${resources.schemas.bronze.name}
              silver_schema: ${resources.schemas.silver.name}
              gold_schema: ${resources.schemas.gold.name}
              model_name: claims_damage_level
              # Blank means the notebook builds /Users/<whoever runs it>/smart_claims/... , which
              # is what keeps a dev run out of a colleague's experiment. Set it explicitly for a
              # shared prod experiment.
              experiment_path: ""
              # The transcript's checkpoint, and it stays. A ResNet-18 was tried here to see
              # whether a smaller model would fit the serverless UDF worker that
              # [UDF_PYSPARK_ERROR.OOM] was crashing; it made no difference, which is the useful
              # result -- torch's own footprint dominates, not the ~11M vs ~25M of weights. The
              # scoring step is what had to change instead; see the notebook's batch inference
              # cell.
              base_model: microsoft/resnet-50
              image_size: "224"
              epochs: "5"
              batch_size: "8"
              learning_rate: "5e-5"
              test_fraction: "0.25"
              random_seed: "42"

          # NO COMPUTE BLOCK -- this task runs on serverless, like everything else in the bundle.
          #
          # This used to be the one classic cluster here, a single-node 16.4.x-cpu-ml runtime, on
          # the transcript's reasoning: "we will use a machine learning cluster as it has lots of
          # those frameworks and libraries that we need already pre-installed". That is a real
          # advantage and it is gone -- this workspace refuses the job outright:
          #
          #     Only serverless compute is supported in the workspace. (400 INVALID_PARAMETER_VALUE)
          #
          # A `bundle deploy` is all-or-nothing, so while that cluster spec was here NOTHING in
          # this bundle could deploy, not just this job. Omitting the compute block is the fix;
          # a serverless notebook task needs no spec at all.
          #
          # WHAT THE SWITCH COSTS: the ML runtime's pre-installed torch. The notebook's %pip cell
          # now names torch, torchvision and scikit-learn alongside transformers and datasets --
          # see the "Why serverless" section at the top of the notebook for why they live there
          # rather than in an `environments:` block here.
          #
          # `data_security_mode: SINGLE_USER` is also gone, and is not replaced: serverless
          # already runs under the identity of whoever triggers the job, which is what that
          # setting was buying. The notebook's UC reads and its model registration are unchanged.

          # One retry, matching clean_and_aggregate in transformations.job.yml. The failure it
          # guards has changed shape -- no instance to fail to acquire any more, but a PyPI or
          # Hugging Face fetch can still time out. It is also why the notebook is safe to re-run:
          # every table it writes is `mode("overwrite")` and registering a second model version
          # is additive.
          max_retries: 1
          min_retry_interval_millis: 60000

          # Generous but finite. Serverless starts in well under a minute rather than the ~5 a
          # cold classic cluster took, but that saving is spent again installing torch. Five
          # epochs of ResNet-50 on CPU is another ten minutes or so. Without a timeout a hung
          # Hugging Face download would hold the run open indefinitely.
          timeout_seconds: 5400
