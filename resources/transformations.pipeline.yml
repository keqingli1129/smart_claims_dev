# Part 4: bronze -> silver -> gold.
#
# ONE pipeline for both layers, unlike Parts 1-3 which each got their own. The transcript makes
# the same call -- a single "transformations" pipeline holding a bronze-to-silver file and a
# silver-to-gold file -- and here it is also the technically correct one. The other three
# pipelines are separate because they ingest from unrelated systems and fail for unrelated
# reasons. Silver and gold are not independent: gold reads silver, and splitting them across
# two pipelines would sever that dependency, leaving nothing to order the refreshes and no
# lineage between them.
#
# Two globs rather than one, because `transformations/**` (Part 1) matches that exact directory
# name followed by a separator, so sibling directories stay out of each other's way. `**` is
# not optional -- the pipelines API rejects a single asterisk.
#
# Default schema is SILVER. Silver datasets are declared with bare names and inherit it; gold
# datasets carry a fully-qualified `name=` built from `gold_schema` below. That is the
# supported way for one pipeline to publish into two schemas.

resources:
  pipelines:
    transformations:
      name: transformations
      catalog: ${var.catalog}
      schema: ${resources.schemas.silver.name}
      serverless: true
      root_path: "../src/smart_claims_dev_etl"

      libraries:
        - glob:
            include: ../src/smart_claims_dev_etl/transformations_silver/**
        - glob:
            include: ../src/smart_claims_dev_etl/transformations_gold/**

      configuration:
        # Fully qualified: the pipeline's own catalog+schema is silver, so a two-part bronze
        # reference would resolve to the wrong place.
        bronze_schema: ${var.catalog}.${resources.schemas.bronze.name}
        # Schema name only -- gold lives in the same catalog as the pipeline.
        #
        # Both resolve through RESOURCES rather than ${var.*_schema}, so development mode's
        # dev_<username>_ prefix is picked up without any code knowing it exists.
        gold_schema: ${resources.schemas.gold.name}

      environment:
        dependencies:
          - --editable ${workspace.file_path}
          # The transcript's pipeline fails here: "this pipeline failed as I don't have this
          # geopy library installed on the serverless cluster", fixed by adding the dependency
          # under Settings -> Environment. This line is that fix, pinned and in source control
          # rather than clicked in once per workspace.
          #
          # It cannot go in pyproject.toml: for pipelines, dependencies are cached during
          # development, which is why the project template says to declare them here instead.
          - geopy==2.4.1
