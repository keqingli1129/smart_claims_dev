[project]
name = "smart_claims_dev"
version = "0.0.1"
authors = [{ name = "keqingli1129@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
    "databricks-sdk[notebook]>=0.139.0",
]

# Local-only, for running and editing the Streamlit app in src/app/. Deliberately a dependency
# group rather than [project] dependencies: those ship in the wheel that every job and pipeline
# installs, and none of them needs Streamlit. The deployed app installs from
# src/app/requirements.txt instead, which is why the two lists overlap.
app = [
    "streamlit",
    "psycopg2-binary",
    "databricks-sql-connector",
    "databricks-sdk",
]

[project.scripts]
main = "smart_claims_dev.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
